name: CI/CD - Build, Push and (optional) Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set output SHA
        id: vars
        run: echo "::set-output name=sha::${GITHUB_SHA}"

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./Backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/event-backend:latest
            ghcr.io/${{ github.repository_owner }}/event-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/event-frontend:latest
            ghcr.io/${{ github.repository_owner }}/event-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: secrets.KUBECONFIG != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG }}" > kubeconfig
          chmod 600 kubeconfig
          export KUBECONFIG=$PWD/kubeconfig

      - name: Apply manifests
        run: |
          kubectl apply -f k8s/

      - name: Rollout updated images (point to the current commit tag)
        run: |
          kubectl -n event-management set image deployment/backend backend=ghcr.io/${{ github.repository_owner }}/event-backend:${{ github.sha }} || true
          kubectl -n event-management set image deployment/frontend frontend=ghcr.io/${{ github.repository_owner }}/event-frontend:${{ github.sha }} || true
