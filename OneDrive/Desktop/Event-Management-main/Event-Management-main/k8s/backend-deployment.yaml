apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: event-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: event-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 2025
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/event
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-root-password
          readinessProbe:
            tcpSocket:
              port: 2025
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 2025
            initialDelaySeconds: 30
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: event-management
spec:
  selector:
    app: backend
  ports:
    - port: 2025
      targetPort: 2025
  type: ClusterIP
